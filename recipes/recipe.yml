# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: cosmic-vivobook
description: Fedora COSMIC Atomic ajustado para o Asus Vivobook S14 (Core Ultra 5 225H)

base-image: quay.io/fedora-ostree-desktops/cosmic-atomic
image-version: 45

modules:
  # 1. Arquivos do sistema (regra de limite de carga + script de setup)
  - type: files
    files:
      - source: system
        destination: /

  # 2. Pacotes: o que você já tinha + os extras
  - type: dnf
    repos:
      nonfree: rpmfusion
      # Howdy desativado: o COPR ainda não tem build para Fedora 45 (Python 3.15)
      # copr:
      #   - ronnypfannschmidt/howdy-beta
    install:
      packages:
        # --- já estavam na sua imagem atual ---
        - network-manager-applet
        - NetworkManager-openvpn
        - NetworkManager-openvpn-gnome
        - https://github.com/motixo/orbit/releases/latest/download/orbit-x86_64.rpm
        # --- novos ---
        # Biopass (reconhecimento facial com IR, alternativa ao Howdy)
        # Ao atualizar a versão, troque o número nos dois lugares do link
        - https://github.com/phucvinh57/biopass/releases/download/1.5.1/biopass-1.5.1-1.x86_64.rpm
        - libavcodec-freeworld   # H.264/HEVC completos
        # RDP para clientes (RustConn/Remmina usam como cliente externo)
        - freerdp
        # Chaveiro para salvar senhas (libsecret): oo7, padrão do Fedora 45
        - oo7-daemon
        - pam_oo7
        - libva-utils            # comando vainfo
        - v4l-utils              # comando v4l2-ctl (achar a câmera IR)
        - powertop

  # 3. Troca o driver de vídeo "livre" do Fedora pelo completo do RPM Fusion
  - type: script
    snippets:
      - "dnf5 -y swap libva-intel-media-driver intel-media-driver --allowerasing"
      - "chmod +x /usr/bin/vivobook-setup"

  # 4. Assinatura da imagem (mantenha sempre por último)
  - type: signing
